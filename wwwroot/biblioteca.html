<header class="topbar">
  <div class="breadcrumbs"><span>SoundSpace</span><span class="breadcrumb-separator">/</span><strong>Sua biblioteca</strong></div>
  <div class="profile-chip"><span class="profile-avatar">S</span><span>Meu espaço</span></div>
</header>

<section class="library-page-section" aria-labelledby="library-title">
  <div class="section-heading library-page-heading">
    <div><p class="eyebrow">GUARDADOS NO SEU ESPAÇO</p><h1 id="library-title">Sua biblioteca</h1></div>
    <div class="library-heading-actions">
      <span class="library-count" id="library-count"></span>
      <button class="subtle-button" id="refresh-library" type="button">↻ <span>Atualizar</span></button>
    </div>
  </div>
  <p class="library-filter-label" id="library-filter-label" hidden></p>
  <button class="text-link clear-library-filter" id="clear-library-filter" type="button" hidden>Ver biblioteca completa</button>
  <p class="status-message" id="library-status" role="status" aria-live="polite"></p>
  <div class="library-list" id="library-list"></div>
  <div class="empty-state" id="library-empty" hidden>
    <span class="empty-icon" aria-hidden="true">♫</span>
    <h2 id="library-empty-title">Seu próximo som favorito começa aqui</h2>
    <p id="library-empty-description">Pesquise um vídeo, salve na biblioteca e encontre-o por aqui depois.</p>
    <a class="text-link" href="#buscar">Explorar vídeos <span aria-hidden="true">↗</span></a>
  </div>
</section>
<footer class="footer-note"><span>Feito para ouvir do seu jeito.</span><span>Sua coleção, no seu espaço.</span></footer>
